name: Sugerir uma melhoria
description: Proponha uma melhoria para a Glibrary.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
      description: Que tarefa está difícil ou impossível hoje?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solução proposta
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
    validations:
      required: false
