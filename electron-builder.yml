appId: com.cazubii.glibrary
productName: Glibrary
asarUnpack:
  - "node_modules/node-pty/**/*"
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
icon: resources/icon.png
win:
  icon: resources/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  icon: resources/icon.png
  target:
    - dmg
linux:
  icon: resources/icon.png
  target:
    - AppImage
