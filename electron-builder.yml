appId: com.cazubii.glibrary
productName: Glibrary
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
icon: resources/icon.png
win:
  icon: resources/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  icon: resources/icon.png
  target:
    - dmg
    - zip
linux:
  icon: resources/icon.png
  target:
    - AppImage
publish:
  provider: github
  owner: Cazubii
  repo: Glibrary
  releaseType: release
